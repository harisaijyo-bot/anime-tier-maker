<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>アニメティア表メーカー</title>
<style>
:root{--ink:#24232d;--muted:#777584;--paper:#fbf8f4;--accent:#ff765e;--line:#e8e2dc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#fff0e8 0,transparent 38%),var(--paper);font-family:Inter,"Noto Sans JP","Yu Gothic UI",sans-serif;color:var(--ink)}
header{padding:34px max(22px,calc((100vw - 1180px)/2)) 20px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:800}h1{font-size:clamp(28px,4vw,43px);letter-spacing:-.05em;margin:8px 0 4px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:11px 15px;font-weight:700;transition:.15s}button:hover{transform:translateY(-1px);box-shadow:0 5px 15px #33251a12}.primary{background:var(--ink);color:white;border-color:var(--ink)}main{max-width:1180px;margin:auto;padding:10px 22px 60px}.toolbar{display:flex;gap:10px;align-items:center;margin:10px 0 15px}.search{flex:1;max-width:470px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;outline:none}.search:focus{border-color:var(--accent)}.hint{font-size:12px;color:var(--muted)}#board{display:grid;gap:8px}.tier{display:grid;grid-template-columns:112px 1fr;min-height:145px;border:1px solid #e9e3df;border-radius:15px;overflow:hidden;background:white;box-shadow:0 3px 12px #39281908}.label{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;color:#34313a}.grade{font-size:29px;line-height:1;font-weight:900}.grade-note{font-size:11px;line-height:1.35;font-weight:750;margin-top:7px;overflow-wrap:anywhere}.items{display:flex;align-items:stretch;gap:9px;padding:10px;min-height:145px;flex-wrap:wrap;background:#fffdfb}.tier.dragover .items{background:#fff2ed;outline:2px dashed var(--accent);outline-offset:-5px}.tile{width:91px;position:relative;cursor:grab;user-select:none}.tile:active{cursor:grabbing}.tile img{display:block;width:91px;height:117px;object-fit:cover;border-radius:8px;background:#eee}.tile .name{font-size:10px;line-height:1.3;text-align:center;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.remove{position:absolute;right:4px;top:4px;padding:0;border:0;background:#17151dcc;color:white;width:22px;height:22px;border-radius:50%;line-height:22px;opacity:0;transition:.15s}.tile:hover .remove{opacity:1}.empty{align-self:center;color:#b2adb0;font-size:12px;padding:8px}.library{margin-top:26px;padding-top:17px;border-top:1px solid var(--line)}.libhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.libhead h2{font-size:16px;margin:0}.pool{display:flex;gap:10px;overflow:auto;padding:5px 2px 12px;min-height:157px}.pool .tile{flex:0 0 91px}.pool:empty:after{content:'検索すると作品が表示されます';color:var(--muted);font-size:12px;padding:16px}.status{font-size:11px;color:var(--muted)}footer{font-size:11px;color:var(--muted);padding:20px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24232d;color:white;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.cover-edit{position:absolute;z-index:2;right:4px;top:31px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#24232de8;color:#fff;font-size:14px;cursor:pointer;opacity:0;transition:.15s}.name-edit{position:absolute;z-index:2;right:4px;top:59px;width:26px;height:26px;padding:0;border:0;border-radius:8px;background:#24232de8;color:#fff;font-size:14px;cursor:pointer;opacity:0}.tile:hover .cover-edit,.tile:hover .name-edit,.cover-edit:focus-within{opacity:1}.cover-edit input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.add-form{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0 14px}.add-form input[type=text]{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}.add-form select,.add-form input[type=file]{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:12px}.add-form button{padding:9px 13px}@media(hover:none){.cover-edit,.name-edit{opacity:.9}}@media(max-width:600px){header{align-items:start;flex-direction:column}.tier{grid-template-columns:78px 1fr;min-height:125px}.grade{font-size:24px}.grade-note{font-size:9px;margin-top:5px}.items{min-height:125px;gap:7px;padding:8px}.tile,.tile img{width:72px}.tile img{height:96px}.tile .name{font-size:9px}.toolbar{align-items:stretch;flex-direction:column}.search{max-width:none}}
@media print{body{background:white}header{padding:12px 0}.actions,.toolbar,.library,.remove,.cover-edit,.name-edit,footer{display:none!important}main{padding:0;max-width:none}.tier{box-shadow:none;break-inside:avoid}.tile{width:80px}.tile img{width:80px;height:104px}}
</style></head>
<body><header><div><div class="eyebrow">MY ANIME RANKING</div><h1>アニメティア表</h1><div class="sub">好きな作品を並べて、自分だけのランキングをつくろう。</div></div><div class="actions"><button id="reset">初期配置に戻す</button><button id="save" class="primary">画像で保存 ↓</button></div></header>
<main><div class="toolbar"><input id="search" class="search" placeholder="作品を検索（例：葬送のフリーレン）" autocomplete="off"><span class="hint">カードをドラッグして移動。×で表から外せます。</span></div><div id="board"></div><section class="library"><div class="libhead"><h2>作品を追加</h2><span class="status" id="status">指定作品のカバーを読み込み中…</span></div><form class="add-form" id="add-form"><input id="new-title" type="text" placeholder="追加するアニメ名" required><select id="new-tier" aria-label="追加先"><option value="S">S</option><option value="A">A</option><option value="B" selected>B</option><option value="C">C</option><option value="D">D</option></select><input id="new-cover" type="file" accept="image/*" aria-label="ジャケット画像（任意）"><button class="primary" type="submit">作品を追加</button></form><div class="hint" style="margin:0 0 8px">画像なしで追加すると作品名から表紙を検索します。画像はカード右上の📷、名前は✎から変更できます。</div><div class="pool" id="pool"></div></section><footer>画像出典：Kitsu / Jikan 公開データ。アップロードしたカバーと追加作品はこのブラウザーに保存します。</footer></main><div class="toast" id="toast"></div>
<script>
const tiers=[['S','#ffaaa0','人生が変わった'],['A','#ffd18d','全員に勧めたい'],['B','#fff0a7','面白い'],['C','#b9dfc1','全部見た'],['D','#b9d8f2','合わなかった']];let catalog=[],placed={},dragId=null,timer;
const board=document.querySelector('#board'),pool=document.querySelector('#pool');
const raw=``;
const records=raw.split('\n').map(s=>s.split('|')).filter(x=>x.length>1);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const STORE_KEY='anime-tier-maker-v3';let savedState={};try{savedState=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch(e){}let appliedMigrations=new Set(savedState.migrations||[]);
function placeholder(title){const colors=[['#f6b5a6','#704b54'],['#b7d5d0','#36575b'],['#f0d28a','#65502e'],['#b9c4eb','#454b78'],['#dfb6d4','#684765'],['#b9c9a0','#405841']];let seed=0;for(const c of title)seed=(seed*31+c.codePointAt(0))>>>0;const [bg,ink]=colors[seed%colors.length];const safe=title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const chars=Array.from(safe);const lines=[];for(let i=0;i<chars.length&&lines.length<4;i+=8)lines.push(chars.slice(i,i+8).join(''));const text=lines.map((line,i)=>`<text x="18" y="${139+i*20}" font-size="17" font-weight="700" fill="${ink}" font-family="sans-serif">${line}</text>`).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="180" height="230" viewBox="0 0 180 230"><rect width="180" height="230" rx="12" fill="${bg}"/><circle cx="140" cy="64" r="42" fill="${ink}" opacity=".13"/><circle cx="140" cy="64" r="27" fill="none" stroke="${ink}" stroke-width="2" opacity=".35"/><path d="M0 110 Q60 75 180 111 V230 H0Z" fill="#fff" opacity=".24"/><text x="17" y="28" font-size="9" letter-spacing="3" fill="${ink}" opacity=".8" font-family="sans-serif">ANIME  /  MY TIER</text><path d="M18 42h40" stroke="${ink}" opacity=".5"/><text x="18" y="96" font-size="10" letter-spacing="2" fill="${ink}" opacity=".7" font-family="sans-serif">JAPANESE TITLE</text>${text}<text x="18" y="218" font-size="8" letter-spacing="2" fill="${ink}" opacity=".65" font-family="sans-serif">COVER ART</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
records.forEach(([tier,originalTitle],i)=>{const id=String(i),title=savedState.names?.[id]||originalTitle;catalog.push({id,title,cover:savedState.covers?.[id]||placeholder(title),tier,uploaded:!!savedState.covers?.[id]});(placed[tier]??=[]).push(id)});(savedState.extras||[]).forEach(a=>{if(!catalog.some(x=>x.id===a.id)){catalog.push({...a});if(a.tier&&placed[a.tier])placed[a.tier].push(a.id)}});if(savedState.placed){placed={S:[],A:[],B:[],C:[],D:[]};const ids=new Set(catalog.map(x=>x.id));for(const key of Object.keys(placed))placed[key]=(savedState.placed[key]||[]).filter(id=>ids.has(id));for(const a of catalog){const key=Object.keys(placed).find(k=>placed[k].includes(a.id));if(key)a.tier=key;else if(Number.isInteger(Number(a.id))&&Number(a.id)<records.length){const originalTier=records[Number(a.id)][0];a.tier=originalTier;placed[originalTier].push(a.id)}else if(!a.tier||a.tier==='pool')a.tier='pool'}}
function saveUserState(){try{const baseCount=records.length;const covers={},names={};catalog.slice(0,baseCount).forEach((a,i)=>{if(a.uploaded)covers[a.id]=a.cover;if(a.title!==records[i][1])names[a.id]=a.title});const extras=catalog.slice(baseCount).map(a=>({id:a.id,title:a.title,cover:a.cover,tier:a.tier,uploaded:!!a.uploaded}));localStorage.setItem(STORE_KEY,JSON.stringify({covers,names,extras,placed,migrations:[...appliedMigrations]}))}catch(e){toast('保存容量を超えました。画像サイズを小さくしてください')}}



function render(){board.innerHTML='';for(const [key,color,label] of tiers){const row=document.createElement('section');row.className='tier';row.dataset.tier=key;row.innerHTML=`<div class="label" style="background:${color}"><span class="grade">${key}</span><span class="grade-note">${label}</span></div><div class="items"></div>`;const area=row.querySelector('.items');(placed[key]||[]).forEach(id=>{let a=catalog.find(x=>x.id===id);if(a)area.append(card(a,true))});row.ondragover=e=>{e.preventDefault();row.classList.add('dragover')};row.ondragleave=()=>row.classList.remove('dragover');row.ondrop=e=>{e.preventDefault();row.classList.remove('dragover');if(dragId)move(dragId,key)};board.append(row)}renderPool()}
function card(a,inBoard){const el=document.createElement('div');el.className='tile';el.draggable=true;el.dataset.id=a.id;el.innerHTML=`<img loading="lazy" src="${a.cover}" alt="${esc(a.title)}"><div class="name">${esc(a.title)}</div><label class="cover-edit" title="${esc(a.title)}の画像を差し替え">📷<input type="file" accept="image/*" aria-label="${esc(a.title)}の画像を差し替え"></label><button type="button" class="name-edit" title="作品名を変更" aria-label="${esc(a.title)}の名前を変更">✎</button>${inBoard?'<button class="remove" title="表から外す">×</button>':''}`;const img=el.querySelector('img');img.onerror=()=>{if(img.dataset.fallbackApplied)return;img.dataset.fallbackApplied='1';img.src=placeholder(a.title)};const file=el.querySelector('input[type=file]');file.onchange=async e=>{e.stopPropagation();const f=file.files?.[0];if(!f)return;try{a.cover=await imageToData(f);a.uploaded=true;saveUserState();render();toast('ジャケット画像を差し替えました')}catch(err){toast('画像を読み込めませんでした')}};file.onclick=e=>e.stopPropagation();el.querySelector('.name-edit').onclick=e=>{e.stopPropagation();const next=prompt('新しい作品名を入力してください',a.title)?.trim();if(!next||next===a.title)return;if(catalog.some(x=>x!==a&&titleKey(x.title)===titleKey(next))){toast('同じ作品名がすでにあります');return}a.title=next;if(!a.uploaded&&a.cover.startsWith('data:image/svg+xml'))a.cover=placeholder(next);saveUserState();render();toast('作品名を変更しました')};el.ondragstart=()=>{dragId=a.id};el.ondragend=()=>{dragId=null};if(inBoard)el.querySelector('.remove').onclick=e=>{e.stopPropagation();placed[a.tier]=placed[a.tier].filter(x=>x!==a.id);a.tier='pool';saveUserState();render()};else el.onclick=e=>{if(e.target.closest('.cover-edit,.name-edit'))return;move(a.id,'B')};return el}
function renderPool(){pool.innerHTML='';const used=new Set(Object.values(placed).flat());catalog.filter(x=>!used.has(x.id)).forEach(a=>pool.append(card(a,false)))}function move(id,key){for(const k of Object.keys(placed))placed[k]=placed[k].filter(x=>x!==id);const a=catalog.find(x=>x.id===id);if(!a)return;a.tier=key;placed[key].push(id);saveUserState();render()}
function imageToData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const scale=Math.min(1,640/image.width,840/image.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))};image.src=reader.result};reader.readAsDataURL(file)})}
function makeQuery(batch){return 'query{'+batch.map((r,i)=>`m${i}:Media(search:"${r[1].replace(/\\/g,'\\\\').replace(/"/g,'\\"')}",type:ANIME,isAdult:false){title{native romaji} coverImage{extraLarge large}}`).join(' ')+'}'}
function titleKey(s=''){return s.normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'')}
const titleAliases={'四月は君のウソ':['四月は君の嘘'],'マクロス':['超時空要塞マクロス'],'ノーゲームノーライフ':['ノーゲーム・ノーライフ'],'Panty & Stocking with Garterbelt':['Panty and Stocking with Garterbelt']};
let jikanNextAt=0;async function jikanCover(item){const slot=Math.max(Date.now(),jikanNextAt);jikanNextAt=slot+390;await new Promise(resolve=>setTimeout(resolve,slot-Date.now()));const response=await fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(item.title)+'&limit=10&sfw=true');if(!response.ok)return '';const json=await response.json();const wanted=[item.title,...(titleAliases[item.title]||[])].map(titleKey);for(const result of json.data||[]){const names=[result.title_japanese,result.title,...(result.titles||[]).map(x=>x.title)].filter(Boolean).map(titleKey);if(names.some(name=>wanted.includes(name)))return result.images?.jpg?.large_image_url||result.images?.jpg?.image_url||''}return ''}
async function findCover(item){const wanted=[item.title,...(titleAliases[item.title]||[])].map(titleKey);try{const url='https://kitsu.io/api/edge/anime?filter%5Btext%5D='+encodeURIComponent(item.title)+'&page%5Blimit%5D=10';const res=await fetch(url,{headers:{Accept:'application/vnd.api+json'}});if(res.ok){const json=await res.json();for(const entry of json.data||[]){const a=entry.attributes||{};const names=[a.canonicalTitle,...Object.values(a.titles||{})].filter(Boolean).map(titleKey);if(names.some(n=>wanted.includes(n))){const image=a.posterImage?.original||a.posterImage?.large||a.posterImage?.small;if(image)return image}}}}catch(e){}try{return await jikanCover(item)}catch(e){return ''}}
async function loadCovers(){const status=document.querySelector('#status');let next=0,done=0,found=0;status.textContent=`0 / ${records.length} · 作品名が一致する表紙を確認中`;
async function worker(){while(true){const i=next++;if(i>=records.length)return;const item=catalog[i];if(!item.uploaded){const image=await findCover(item);if(image){item.cover=image;found++;document.querySelectorAll(`.tile[data-id="${item.id}"] img`).forEach(img=>{img.dataset.fallbackApplied='';img.src=item.cover})}}done++;status.textContent=`${done} / ${records.length} 作品 · タイトル一致の実画像 ${found} 枚`;}}
await Promise.all(Array.from({length:6},worker));status.textContent=`${records.length} 作品を配置済み · タイトル一致の実画像 ${found} 枚（未一致は作品名入りカバー）`}
const searchQuery=`query($search:String){Page(page:1,perPage:20){media(type:ANIME,sort:POPULARITY_DESC,search:$search,isAdult:false){id title{native romaji} coverImage{extraLarge large}}}}`;
async function searchAnime(q){const status=document.querySelector('#status');try{const res=await fetch('https://kitsu.io/api/edge/anime?filter%5Btext%5D='+encodeURIComponent(q)+'&page%5Blimit%5D=20',{headers:{Accept:'application/vnd.api+json'}});if(!res.ok)throw Error();const data=(await res.json()).data||[];const existing=new Set(catalog.map(x=>x.title));for(const x of data){let title=x.attributes?.titles?.en_jp||x.attributes?.canonicalTitle;if(title&&!existing.has(title)){const a={id:'x'+x.id,title,cover:x.attributes?.posterImage?.original||x.attributes?.posterImage?.large||placeholder(title),tier:'pool'};catalog.push(a);pool.append(card(a,false));existing.add(title)}}status.textContent=`検索結果を作品追加欄に表示 · クリックでBに追加`}catch(e){status.textContent='検索に失敗しました。接続を確認してください'}}
document.querySelector('#search').addEventListener('input',e=>{clearTimeout(timer);let q=e.target.value.trim();if(q)timer=setTimeout(()=>searchAnime(q),450)});
document.querySelector('#add-form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#new-title'),fileInput=document.querySelector('#new-cover'),title=input.value.trim(),tier=document.querySelector('#new-tier').value;if(!title)return;if(catalog.some(a=>titleKey(a.title)===titleKey(title))){toast('この作品はすでに登録されています');return}const file=fileInput.files?.[0];let cover=placeholder(title);try{if(file)cover=await imageToData(file)}catch(err){toast('画像を読み込めませんでした');return}const item={id:'u'+Date.now(),title,cover,tier,uploaded:!!file};catalog.push(item);move(item.id,tier);input.value='';fileInput.value='';if(!file){document.querySelector('#status').textContent=`「${title}」の表紙を検索中…`;const image=await findCover(item);if(image){item.cover=image;saveUserState();render();toast('作品を追加し、表紙を設定しました')}else{toast('作品を追加しました。📷から画像を設定できます')}}else toast('作品とジャケット画像を追加しました')};
function blobAsData(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
async function imageForExport(src,title){if(src.startsWith('data:'))return src;const proxy='https://images.weserv.nl/?url='+encodeURIComponent(src)+'&w=640&h=840&fit=contain&output=jpg';for(const url of [src,proxy]){try{const response=await fetch(url,{mode:'cors'});if(response.ok)return await blobAsData(await response.blob())}catch(e){}}return placeholder(title)}
async function saveBoardImage(){const btn=document.querySelector('#save'),oldLabel=btn.textContent;btn.disabled=true;const images=[...board.querySelectorAll('.tile img')],originals=images.map(img=>img.src);try{btn.textContent='画像を準備中…';if(!window.html2canvas){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=ok;s.onerror=no;document.head.append(s)})}let next=0;async function worker(){while(true){const i=next++;if(i>=images.length)return;images[i].src=await imageForExport(originals[i],images[i].alt);try{await images[i].decode()}catch(e){}btn.textContent=`画像を準備中 ${Math.min(next,images.length)} / ${images.length}`}}await Promise.all(Array.from({length:5},worker));const canvas=await html2canvas(board,{backgroundColor:'#fbf8f4',scale:2,useCORS:false,allowTaint:false});const link=document.createElement('a');link.download='アニメティア表.png';link.href=canvas.toDataURL('image/png');link.click();toast('ジャケット画像入りのPNGを保存しました')}catch(e){window.print();toast('画像を保存できませんでした。印刷画面から保存してください')}finally{images.forEach((img,i)=>img.src=originals[i]);btn.textContent=oldLabel;btn.disabled=false}}
document.querySelector('#reset').onclick=()=>{placed={S:[],A:[],B:[],C:[],D:[]};records.forEach(([tier],i)=>{catalog[i].tier=tier;(placed[tier]??=[]).push(String(i))});catalog.slice(records.length).forEach(a=>a.tier='pool');saveUserState();render()};document.querySelector('#save').onclick=saveBoardImage;
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
render();loadCovers();
</script></body></html>
